<!DOCTYPE html>
<html>
<head>
    <title>Room Not Found - NinChess</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
    
        body {
            min-height: 100vh;
    
            display: flex;
            align-items: center;
            justify-content: center;
    
            font-family: Arial, sans-serif;
    
            background:
                radial-gradient(
                    circle at top,
                    #252525 0%,
                    #151515 45%,
                    #0d0d0d 100%
                );
    
            color: #f1f1f1;
        }
    
        .container {
            width: min(90%, 420px);
            padding: 40px 30px;
    
            text-align: center;
    
            background: rgba(30, 30, 30, 0.9);
    
            border: 1px solid #333;
            border-radius: 18px;
    
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5);
        }
    
        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }
    
        .icon {
            font-size: 55px;
            margin-bottom: 20px;
            opacity: 0.8;
        }
    
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }
    
        p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 28px;
        }
    
        .home-button {
            display: inline-block;
    
            padding: 12px 22px;
    
            border-radius: 10px;
    
            background: #f1f1f1;
            color: #111;
    
            text-decoration: none;
            font-weight: bold;
    
            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }
    
        .home-button:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }
    
        .home-button:active {
            transform: translateY(0);
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            NinChess
        </div>

        <div class="icon">
            ♟
        </div>

        <h1>Room doesn't exist</h1>

        <p>
            This chess room may have been closed, deleted,
            or never existed.
        </p>

        <a href="{% url 'create_room' %}" class="home-button">
            Create New Room
        </a>

    </div>

</body>
</html>
