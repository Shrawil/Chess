<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinChess - {{ room_id }}</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(circle at top, #303030 0%, #181818 55%, #101010 100%);

        color: #000000;
        font-family: Arial, sans-serif;
    }

    /* ---------- Header ---------- */

    .header {
        width: min(92vw, 720px);
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 16px;
    }

    .logo {
        margin: 0;
        font-size: 28px;
        letter-spacing: 1px;
    }

    .player {
        padding: 7px 12px;

        border-radius: 20px;

        background: #333;

        font-size: 14px;
        text-transform: capitalize;
    }

    /* ---------- Room information ---------- */

    .room-info {
        width: min(92vw, 720px);

        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 12px;

        color: #aaa;
        font-size: 14px;
    }

    .room-id {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .copy-button {
        border: none;
        border-radius: 6px;

        padding: 6px 10px;

        background: #444;
        color: #ddd;

        cursor: pointer;
        font-size: 12px;

        transition: background 0.15s;
    }

    .copy-button:hover {
        background: #555;
    }

    /* ---------- Board ---------- */

    .board-wrapper {
        padding: 10px;

        background: #111;

        border-radius: 12px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.5),
            0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .chessboard {
        width: min(80vw, 640px);
        height: min(80vw, 640px);

        display: grid;

        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);

        overflow: hidden;

        border-radius: 6px;
    }

    /* ---------- Squares ---------- */

    .square {
        display: flex;
        justify-content: center;
        align-items: center;

        font-size: clamp(32px, 7vw, 58px);

        user-select: none;
        cursor: pointer;

        position: relative;

        transition:
            filter 0.12s,
            transform 0.08s;
    }

    .light {
        background: #f0d9b5;
    }

    .dark {
        background: #b58863;
    }

    .square:hover {
        filter: brightness(1.08);
    }

    /* ---------- Pieces ---------- */

    .piece-white {
        color: #fff;

        text-shadow:
            0 2px 2px rgba(0, 0, 0, 0.65),
            0 0 2px rgba(0, 0, 0, 0.5);

        z-index: 2;
    }

    .piece-black {
        color: #151515;

        text-shadow:
            0 1px 1px rgba(255, 255, 255, 0.25);

        z-index: 2;
    }

    /* ---------- Selected square ---------- */

    .selected {
        box-shadow: inset 0 0 0 5px rgba(255, 215, 0, 0.95);
        filter: brightness(1.15);
    }

    .square.selected::after {
        content: "";
        position: absolute;
        inset: 20%;
        border-radius: 50%;
        background: rgba(255, 215, 0, 0.35);
        pointer-events: none;
    }

    /* ---------- Responsive ---------- */

    @media (max-width: 600px) {

        .header {
            margin-bottom: 10px;
        }

        .logo {
            font-size: 22px;
        }

        .room-info {
            font-size: 12px;
        }

        .board-wrapper {
            padding: 5px;
            border-radius: 8px;
        }

        .chessboard {
            width: 96vw;
            height: 96vw;
        }
    }
    .game-over {
        position: fixed;
        inset: 0;

        display: none;
        align-items: center;
        justify-content: center;

        background: rgba(0, 0, 0, 0.75);

        z-index: 1000;
    }

    .game-over-box {
        background: #1b1b1b;
        padding: 30px;
        border-radius: 16px;
        text-align: center;

        width: min(90%, 400px);
    }

    .game-over-box h2 {
        margin-bottom: 10px;
    }

    .game-over-box p {
        margin-bottom: 20px;
        color: #aaa;
    }

    .game-over-box a {
        display: inline-block;
        padding: 10px 18px;

        border-radius: 8px;
        background: #fff;
        color: #111;

        text-decoration: none;
    }
 
    .turn-indicator {
        margin-bottom: 12px;

        padding: 8px 16px;

        border-radius: 20px;

        background: #333;
        color: #ddd;

        font-size: 14px;
        font-weight: bold;
    }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo">NinChess</h1>

        <div class="player">
            {{ player }}
        </div>
    </div>

    <div class="room-info">

        <div class="room-id">
            Room: <strong>{{ room_id }}</strong>

            <button
                class="copy-button"
                onclick="copyRoomLink()"
            >
                Copy Link
            </button>
            <button onclick="resignGame()">
                Resign
            </button>
        </div>
    </div>

    <div id="gameOver" class="game-over">
        <div class="game-over-box">
            <h2>Room Closed</h2>

            <p>
                This room no longer exists.
            </p>

            <a href="{% url 'home' %}">
                Create New Room
            </a>
        </div>
    </div>
    <div id="turnIndicator" class="turn-indicator">
        Waiting...
    </div>
    <div class="board-wrapper">
        <div id="chessboard" class="chessboard"></div>
    </div>

    <script>
        const roomId = "{{ room_id }}";
        const player = "{{ player }}";
        const flipped = player === "black";
        const csrfToken = "{{ csrf_token }}";
        
        let currentTurn = null; 
        let selectedSquare = null;

        const pieces = {
            // White pieces
            "K": "♔", "Q": "♕", "R": "♖", "B": "♗", "N": "♘", "P": "♙",
            // Black pieces (fixed to display filled symbols)
            "k": "♚", "q": "♛", "r": "♜", "b": "♝", "n": "♞", "p": "♟"
        };

        function copyRoomLink() {

            navigator.clipboard.writeText(
                window.location.href
            );

            const button = document.querySelector(".copy-button");

            button.textContent = "Copied!";

            setTimeout(() => {
                button.textContent = "Copy Link";
            }, 1500);
        }

        function createBoard(fen) {
            const boardElement = document.getElementById("chessboard");
            boardElement.innerHTML = "";
            const position = fen.split(" ")[0];
            const rows = position.split("/");        
            let board = [];       
            for (let row = 0; row < 8; row++) {
                let currentRow = [];        
                for (const character of rows[row]) {
                    if (!isNaN(character)) {
                        for (let i = 0; i < Number(character); i++) {
                            currentRow.push("");
                        }
                    } else {
                        currentRow.push(character);
                    }
                }
                board.push(currentRow);
            }        
            // Flip the visual board for Black
            if (flipped) {
                board.reverse();
                        for (let row of board) {
                    row.reverse();
                }
            }
                    for (let row = 0; row < 8; row++) {
                        for (let column = 0; column < 8; column++) {
                            createSquare(
                        row,
                        column,
                        board[row][column]
                    );
                }
            }
        }


        function createSquare(row, column, piece) {
            const square = document.createElement("div");
        
            const isLight = (row + column) % 2 === 0;
        
            square.classList.add("square");
        
            if (isLight) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }
        
            square.textContent = piece;
        
            // Convert visual position to actual chess position
            let actualRow = flipped ? 7 - row : row;
            let actualColumn = flipped ? 7 - column : column;
        
            const files = "abcdefgh";
        
            const file = files[actualColumn];
            const rank = 8 - actualRow;
        
            square.textContent = pieces[piece] || "";
            square.dataset.piece = piece;
            square.dataset.square = file + rank;
        
            square.addEventListener(
                "click",
                handleSquareClick
            );
        
            document
                .getElementById("chessboard")
                .appendChild(square);
        }
        
        function handleSquareClick(event) {
        
            if (
                (player === "white" && currentTurn !== "w") ||
                (player === "black" && currentTurn !== "b")
            ) {
                return;
            }
                    
            const square = event.currentTarget;
            const squareName = square.dataset.square;
            const piece = square.dataset.piece;
        
            const isWhitePiece = piece && piece === piece.toUpperCase();
            const isBlackPiece = piece && piece === piece.toLowerCase();
        
            const isOwnPiece =
                (player === "white" && isWhitePiece) ||
                (player === "black" && isBlackPiece);
        
            // Nothing selected yet
            if (selectedSquare === null) {
        
                if (!isOwnPiece) {
                    return;
                }
        
                selectSquare(square);
        
                return;
            }
        
            // Clicking another own piece switches selection
            if (isOwnPiece) {
        
                selectSquare(square);
        
                return;
            }
        
            // Clicking the selected square deselects it
            if (selectedSquare === squareName) {
        
                clearSelection();
        
                return;
            }
        
            // Otherwise attempt a move
            const move = selectedSquare + squareName;
        
            console.log("Attempting move:", move);
        
            sendMove(move);
        
            clearSelection();
        }
        
        function selectSquare(square) {
        
            clearSelection();
        
            selectedSquare = square.dataset.square;
        
            square.classList.add("selected");
        
            console.log("Selected:", selectedSquare);
        }
        
        
        function clearSelection() {
        
            selectedSquare = null;
        
            document
                .querySelectorAll(".selected")
                .forEach(square => {
                    square.classList.remove("selected");
                });
        }

        async function sendMove(move) {
            const formData = new FormData();
            formData.append("move", move);
            const response = await fetch(
                `/room/${roomId}/move/`,
                {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": csrfToken
                    },
                    body: formData
                }
            );
            const data = await response.json();
            if (!response.ok) {
                console.log("Move rejected:", data.error);
                return;
            }
            console.log("Move accepted:", move);
            updateBoard();
        }

        async function updateBoard() {

            const response = await fetch(`/room/${roomId}/state/`);

            if (response.status === 404) {
                clearInterval(boardPolling);
                document.getElementById("gameOver").style.display = "flex";
                return;
            }

            const data = await response.json();

            currentTurn = data.fen.split(" ")[1];

            const isMyTurn =
                (player === "white" && currentTurn === "w") ||
                (player === "black" && currentTurn === "b");

            const turnIndicator = document.getElementById("turnIndicator");

            if (isMyTurn) {
                turnIndicator.textContent = "Your turn";
            } else {
                turnIndicator.textContent =
                    `Waiting for ${currentTurn === "w" ? "White" : "Black"}`;
            }

            createBoard(data.fen);
        }

        async function resignGame() {

            const confirmed = confirm(
                "Are you sure you want to resign?"
            );

            if (!confirmed) {
                return;
            }

            const response = await fetch(`/resign/${roomId}/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken
                }
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = "{% url 'home' %}";
            } else {
                console.error(data.error);
            }
        }

        updateBoard();
        const boardPolling = setInterval(updateBoard, 1000);
    </script>
</body>
</html>
